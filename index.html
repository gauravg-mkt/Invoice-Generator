<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jspdf for native PDF generation (Small file size) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- autoTable plugin for jspdf to handle tables efficiently -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            padding: 20mm;
            box-sizing: border-box;
        }
        
        .editable-input {
            background: transparent;
            border: 1px dashed transparent;
            width: 100%;
            transition: all 0.2s;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .editable-input:hover, .editable-input:focus {
            background: #f8fafc;
            border-color: #cbd5e1;
            outline: none;
        }
        
        @media (max-width: 850px) {
            .a4-page { width: 100%; min-height: auto; padding: 1rem; }
        }

        .remove-row-btn { opacity: 0; transition: opacity 0.2s; }
        tr:hover .remove-row-btn { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden font-sans text-slate-800">

    <!-- Sidebar -->
    <div class="w-80 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10 flex-shrink-0">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-file-invoice text-blue-600"></i> Invoice Tool
            </h1>
        </div>
        
        <div class="p-4">
            <button onclick="createNewInvoice()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md active:scale-95">
                <i class="fa-solid fa-plus"></i> New Invoice
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-4 space-y-2" id="invoiceList">
            <!-- Invoices load here -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-[210mm] mx-auto mb-6 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm sticky top-0 z-20 border border-slate-100">
            <div class="flex items-center gap-2 text-sm font-medium">
                <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse"></span>
                <span id="statusText" class="text-slate-500">Connecting...</span>
            </div>
            <div class="flex gap-3">
                <button onclick="saveInvoice()" class="flex items-center gap-2 px-5 py-2.5 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all font-semibold text-sm">
                    <i class="fa-solid fa-floppy-disk"></i> Save
                </button>
                <button onclick="generateNativePDF()" id="btnDownload" class="flex items-center gap-2 px-5 py-2.5 text-white bg-slate-900 hover:bg-black rounded-xl transition-all font-semibold text-sm shadow-lg active:scale-95">
                    <i class="fa-solid fa-file-pdf"></i> Download PDF
                </button>
            </div>
        </div>

        <div id="invoicePaper" class="a4-page relative text-sm leading-relaxed text-slate-700 border border-slate-200">
            <!-- Header -->
            <div class="flex justify-between items-start mb-12">
                <div>
                    <h2 class="text-5xl font-black text-slate-900 tracking-tighter mb-8">INVOICE</h2>
                    <div class="space-y-1">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">From</p>
                        <input type="text" id="fromName" class="editable-input font-bold text-slate-900 text-base" value="Gaurav Gupta">
                        <input type="text" id="fromAddress" class="editable-input" value="Surrey, BC">
                        <input type="text" id="fromPhone" class="editable-input" value="236-878-6861">
                        <input type="text" id="fromEmail" class="editable-input" value="gauravgupta8319@gmail.com">
                    </div>
                </div>

                <div class="text-right pt-2">
                    <div class="space-y-2">
                        <div class="flex justify-end items-center gap-3">
                            <span class="font-bold text-slate-400 text-xs uppercase">Invoice #</span>
                            <input type="text" id="invoiceNumber" class="editable-input w-24 text-right font-mono font-bold text-slate-900 bg-slate-50" value="001">
                        </div>
                        <div class="flex justify-end items-center gap-3">
                            <span class="font-bold text-slate-400 text-xs uppercase">Date</span>
                            <input type="date" id="invoiceDate" class="editable-input w-36 text-right font-medium">
                        </div>
                        <div class="flex justify-end items-center gap-3">
                            <span class="font-bold text-slate-400 text-xs uppercase">Terms</span>
                            <input type="text" id="paymentTerms" class="editable-input w-36 text-right" value="Due on receipt">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bill To -->
            <div class="mb-12 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Bill To</p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <input type="text" id="toName" class="editable-input font-bold text-slate-900 text-lg" value="Vipin Gupta">
                        <input type="text" id="toCompany" class="editable-input font-semibold text-blue-600" value="Frolic Expressions Speech Therapy Inc">
                    </div>
                    <div class="text-right space-y-1">
                        <textarea id="toAddress" class="editable-input text-right resize-none h-12 overflow-hidden" rows="2">8522 168 Street, Surrey, BC - V4N 5A3</textarea>
                        <input type="text" id="toPhone" class="editable-input text-right" value="(778) 893 8887">
                        <input type="text" id="toEmail" class="editable-input text-right" value="info@frolicexpressions.com">
                    </div>
                </div>
            </div>

            <!-- Items -->
            <table class="w-full mb-6">
                <thead>
                    <tr class="text-slate-400 text-[10px] uppercase tracking-widest border-b border-slate-100">
                        <th class="py-4 text-left font-bold w-1/2">Description</th>
                        <th class="py-4 text-right font-bold px-4">Hours</th>
                        <th class="py-4 text-right font-bold px-4">Rate</th>
                        <th class="py-4 text-right font-bold">Amount</th>
                        <th class="w-10"></th>
                    </tr>
                </thead>
                <tbody id="itemsList"></tbody>
            </table>
            
            <button onclick="addNewRow()" class="mb-12 text-blue-600 font-bold text-xs flex items-center gap-2 hover:bg-blue-50 px-3 py-2 rounded-lg transition-all">
                <i class="fa-solid fa-plus-circle"></i> ADD LINE ITEM
            </button>

            <!-- Totals -->
            <div class="flex justify-end mb-12 border-t border-slate-100 pt-8">
                <div class="w-72 space-y-3">
                    <div class="flex justify-between items-center px-2">
                        <span class="text-slate-400 font-bold text-xs uppercase">Subtotal</span>
                        <span id="subtotalAmount" class="font-bold text-slate-900">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center px-2">
                        <span class="text-slate-400 font-bold text-xs uppercase italic">Discount (%)</span>
                        <input type="number" id="discountPercent" class="editable-input text-right font-bold text-red-500 w-16 bg-red-50" value="0" oninput="calculateTotal()">
                    </div>
                    <div class="flex justify-between items-center bg-blue-600 p-4 rounded-xl text-white shadow-lg">
                        <span class="font-bold text-xs uppercase tracking-widest">Total Due</span>
                        <span id="grandTotal" class="font-black text-2xl">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Notes -->
            <div class="bg-slate-50 p-6 rounded-2xl border border-dashed border-slate-200">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Payment Details</h3>
                <textarea id="paymentNotes" class="editable-input w-full resize-none h-16 font-medium text-slate-600" rows="2">E-transfer to: gauravgupta8319@gmail.com</textarea>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let currentUser = null;
        let currentInvoiceId = null;
        let invoiceList = [];

        async function initAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('statusText').innerText = "Connected";
                document.getElementById('statusIndicator').classList.remove('animate-pulse', 'bg-yellow-400');
                document.getElementById('statusIndicator').classList.add('bg-green-500');
                startFirestoreListener();
            }
        });

        initAuth();

        function startFirestoreListener() {
            const ref = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'invoices');
            onSnapshot(ref, (snapshot) => {
                invoiceList = [];
                snapshot.forEach(doc => { invoiceList.push({ id: doc.id, ...doc.data() }); });
                invoiceList.sort((a, b) => (parseInt(b.invoiceNumber) || 0) - (parseInt(a.invoiceNumber) || 0));
                renderInvoiceList();
            });
        }

        window.renderInvoiceList = () => {
            const container = document.getElementById('invoiceList');
            container.innerHTML = '';
            invoiceList.forEach(inv => {
                const isActive = inv.id === currentInvoiceId;
                const div = document.createElement('div');
                div.className = `p-4 rounded-xl border cursor-pointer transition-all ${isActive ? 'bg-blue-50 border-blue-200 ring-2 ring-blue-100' : 'bg-white border-slate-100 hover:border-blue-200'}`;
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-slate-900">#${inv.invoiceNumber}</span>
                        <button onclick="deleteInvoice('${inv.id}', event)" class="text-slate-300 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                    <div class="text-xs text-slate-500 font-medium truncate">${inv.to?.company || 'No Company'}</div>
                    <div class="flex justify-between items-end mt-3">
                        <span class="text-[10px] text-slate-400 font-bold">${inv.date || ''}</span>
                        <span class="font-bold text-blue-600 text-sm">$${(inv.total || 0).toFixed(2)}</span>
                    </div>
                `;
                div.onclick = () => loadInvoiceIntoForm(inv);
                container.appendChild(div);
            });
        };

        window.addNewRow = (desc = '', hrs = 0, r = 0) => {
            const tbody = document.getElementById('itemsList');
            const tr = document.createElement('tr');
            tr.className = "border-b border-slate-50 group transition-colors hover:bg-slate-50/50";
            tr.innerHTML = `
                <td class="py-4 pr-4"><input type="text" class="editable-input font-semibold item-desc" value="${desc}" oninput="calculateTotal()"></td>
                <td class="py-4 px-4"><input type="number" class="editable-input text-right item-hours" value="${hrs}" step="0.5" oninput="calculateTotal()"></td>
                <td class="py-4 px-4"><input type="number" class="editable-input text-right item-rate" value="${r}" oninput="calculateTotal()"></td>
                <td class="py-4 text-right font-bold text-slate-900 item-total">$0.00</td>
                <td class="py-4 pl-4 text-center">
                    <button onclick="this.closest('tr').remove(); calculateTotal();" class="remove-row-btn text-slate-300 hover:text-red-500"><i class="fa-solid fa-times-circle"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
            calculateTotal();
        };

        window.calculateTotal = () => {
            let sub = 0;
            document.querySelectorAll('#itemsList tr').forEach(row => {
                const h = parseFloat(row.querySelector('.item-hours').value) || 0;
                const r = parseFloat(row.querySelector('.item-rate').value) || 0;
                const rowTotal = h * r;
                sub += rowTotal;
                row.querySelector('.item-total').innerText = '$' + rowTotal.toFixed(2);
            });
            const discP = parseFloat(document.getElementById('discountPercent').value) || 0;
            const discA = (sub * discP) / 100;
            const total = sub - discA;
            document.getElementById('subtotalAmount').innerText = '$' + sub.toFixed(2);
            document.getElementById('grandTotal').innerText = '$' + total.toFixed(2);
            return { sub, total, discA };
        };

        window.loadInvoiceIntoForm = (inv) => {
            currentInvoiceId = inv.id;
            document.getElementById('invoiceNumber').value = inv.invoiceNumber || '';
            document.getElementById('invoiceDate').value = inv.date || '';
            document.getElementById('paymentTerms').value = inv.dueDate || '';
            document.getElementById('paymentNotes').value = inv.notes || '';
            document.getElementById('fromName').value = inv.from?.name || '';
            document.getElementById('fromAddress').value = inv.from?.address || '';
            document.getElementById('fromPhone').value = inv.from?.phone || '';
            document.getElementById('fromEmail').value = inv.from?.email || '';
            document.getElementById('toName').value = inv.to?.name || '';
            document.getElementById('toCompany').value = inv.to?.company || '';
            document.getElementById('toAddress').value = inv.to?.address || '';
            document.getElementById('toPhone').value = inv.to?.phone || '';
            document.getElementById('toEmail').value = inv.to?.email || '';
            document.getElementById('discountPercent').value = inv.discountPercent || 0;
            const tbody = document.getElementById('itemsList');
            tbody.innerHTML = '';
            (inv.items || []).forEach(it => addNewRow(it.description, it.hours, it.rate));
            if (!inv.items?.length) addNewRow();
            renderInvoiceList();
            calculateTotal();
        };

        window.createNewInvoice = () => {
            currentInvoiceId = null;
            let next = "001";
            if (invoiceList.length > 0) {
                const last = parseInt(invoiceList[0].invoiceNumber);
                if (!isNaN(last)) next = String(last + 1).padStart(3, '0');
            }
            document.getElementById('invoiceNumber').value = next;
            document.getElementById('invoiceDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('itemsList').innerHTML = '';
            addNewRow('Digital Marketing / Website Maintenance', 8, 50);
            renderInvoiceList();
        };

        window.saveInvoice = async () => {
            if (!currentUser) return;
            const items = Array.from(document.querySelectorAll('#itemsList tr')).map(row => ({
                description: row.querySelector('.item-desc').value,
                hours: parseFloat(row.querySelector('.item-hours').value) || 0,
                rate: parseFloat(row.querySelector('.item-rate').value) || 0
            }));

            const data = {
                invoiceNumber: document.getElementById('invoiceNumber').value,
                date: document.getElementById('invoiceDate').value,
                dueDate: document.getElementById('paymentTerms').value,
                notes: document.getElementById('paymentNotes').value,
                discountPercent: parseFloat(document.getElementById('discountPercent').value) || 0,
                total: calculateTotal().total,
                from: {
                    name: document.getElementById('fromName').value,
                    address: document.getElementById('fromAddress').value,
                    phone: document.getElementById('fromPhone').value,
                    email: document.getElementById('fromEmail').value,
                },
                to: {
                    name: document.getElementById('toName').value,
                    company: document.getElementById('toCompany').value,
                    address: document.getElementById('toAddress').value,
                    phone: document.getElementById('toPhone').value,
                    email: document.getElementById('toEmail').value,
                },
                items,
                updatedAt: serverTimestamp()
            };

            const ref = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'invoices');
            if (currentInvoiceId) await updateDoc(doc(ref, currentInvoiceId), data);
            else await addDoc(ref, data);
        };

        window.deleteInvoice = async (id, e) => {
            e.stopPropagation();
            if (!confirm("Delete this invoice?")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'invoices', id));
        };

        // NATIVE PDF GENERATION (Super small file size)
        window.generateNativePDF = async () => {
            const btn = document.getElementById('btnDownload');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating...`;
            btn.disabled = true;

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const getVal = id => document.getElementById(id).value;
                const { sub, total, discA } = calculateTotal();
                const discP = getVal('discountPercent');

                // Header
                doc.setFont("helvetica", "bold");
                doc.setFontSize(36);
                doc.setTextColor(31, 41, 55);
                doc.text("INVOICE", 20, 30);

                // Meta Info
                doc.setFontSize(10);
                doc.setTextColor(107, 114, 128);
                doc.text("INVOICE #:", 140, 20);
                doc.setTextColor(31, 41, 55);
                doc.text(getVal('invoiceNumber'), 175, 20, { align: "right" });

                doc.setTextColor(107, 114, 128);
                doc.text("DATE:", 140, 27);
                doc.setTextColor(31, 41, 55);
                doc.text(getVal('invoiceDate'), 175, 27, { align: "right" });

                doc.setTextColor(107, 114, 128);
                doc.text("TERMS:", 140, 34);
                doc.setTextColor(31, 41, 55);
                doc.text(getVal('paymentTerms'), 175, 34, { align: "right" });

                // From
                doc.setFontSize(8);
                doc.setTextColor(156, 163, 175);
                doc.text("FROM", 20, 50);
                doc.setFontSize(10);
                doc.setTextColor(31, 41, 55);
                doc.setFont("helvetica", "bold");
                doc.text(getVal('fromName'), 20, 56);
                doc.setFont("helvetica", "normal");
                doc.text([getVal('fromAddress'), getVal('fromPhone'), getVal('fromEmail')], 20, 61);

                // Bill To
                doc.setFillColor(248, 250, 252);
                doc.roundedRect(20, 80, 170, 35, 3, 3, "F");
                doc.setFontSize(8);
                doc.setTextColor(156, 163, 175);
                doc.text("BILL TO", 26, 88);
                doc.setFontSize(11);
                doc.setTextColor(17, 24, 39);
                doc.setFont("helvetica", "bold");
                doc.text(getVal('toName'), 26, 96);
                doc.setTextColor(37, 99, 235);
                doc.text(getVal('toCompany'), 26, 102);
                
                doc.setFontSize(9);
                doc.setTextColor(75, 85, 99);
                doc.setFont("helvetica", "normal");
                doc.text([getVal('toAddress'), `Ph: ${getVal('toPhone')}`, getVal('toEmail')], 184, 95, { align: "right" });

                // Items Table
                const rows = Array.from(document.querySelectorAll('#itemsList tr')).map(tr => [
                    tr.querySelector('.item-desc').value,
                    tr.querySelector('.item-hours').value,
                    `$${parseFloat(tr.querySelector('.item-rate').value).toFixed(2)}`,
                    tr.querySelector('.item-total').innerText
                ]);

                doc.autoTable({
                    startY: 125,
                    head: [['DESCRIPTION', 'HOURS', 'RATE', 'AMOUNT']],
                    body: rows,
                    theme: 'striped',
                    headStyles: { fillStyle: 'transparent', textColor: [156, 163, 175], fontSize: 8, fontStyle: 'bold' },
                    styles: { fontSize: 9, cellPadding: 5 },
                    columnStyles: {
                        0: { cellWidth: 90 },
                        1: { halign: 'right' },
                        2: { halign: 'right' },
                        3: { halign: 'right', fontStyle: 'bold' }
                    }
                });

                // Totals
                let finalY = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(10);
                doc.setTextColor(107, 114, 128);
                doc.text("SUBTOTAL:", 140, finalY);
                doc.setTextColor(31, 41, 55);
                doc.text(`$${sub.toFixed(2)}`, 184, finalY, { align: "right" });

                if (discA > 0) {
                    finalY += 7;
                    doc.setTextColor(239, 68, 68);
                    doc.text(`DISCOUNT (${discP}%):`, 140, finalY);
                    doc.text(`-$${discA.toFixed(2)}`, 184, finalY, { align: "right" });
                }

                finalY += 5;
                doc.setFillColor(37, 99, 235);
                doc.roundedRect(130, finalY, 60, 15, 2, 2, "F");
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.text("TOTAL DUE", 135, finalY + 10);
                doc.setFontSize(14);
                doc.text(`$${total.toFixed(2)}`, 184, finalY + 10, { align: "right" });

                // Footer
                finalY += 30;
                doc.setFontSize(8);
                doc.setTextColor(156, 163, 175);
                doc.text("PAYMENT DETAILS", 20, finalY);
                doc.setFontSize(10);
                doc.setTextColor(75, 85, 99);
                doc.setFont("helvetica", "normal");
                doc.text(getVal('paymentNotes'), 20, finalY + 7);

                // Save with specific name
                const sender = getVal('fromName').trim() || 'Gaurav-Gupta';
                const client = getVal('toCompany').trim() || 'Client';
                const num = getVal('invoiceNumber').trim() || '001';
                const safeName = `${sender}-${client}-${num}`.replace(/[^a-z0-9]/gi, '-');
                doc.save(`${safeName}.pdf`);

            } catch (err) { console.error(err); } 
            finally {
                btn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> Download PDF`;
                btn.disabled = false;
            }
        };

        window.onload = () => {
            document.getElementById('invoiceDate').value = new Date().toISOString().split('T')[0];
            addNewRow('Digital Marketing / Website Maintenance', 8, 50);
        };
    </script>
</body>
</html>
